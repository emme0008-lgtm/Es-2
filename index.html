<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111820"><link rel="manifest" href="manifest.json"><title>Diario Elettrostrumentisti</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e141b;color:#f4f6f9;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:540px;min-height:100dvh;margin:auto;padding:20px 17px 35px;background:linear-gradient(145deg,#18222d,#101820 55%,#111720)}h1{font-size:25px;line-height:1.13;letter-spacing:.7px;text-align:center;margin:8px 0 6px}h2{font-size:21px;margin:14px 0}p{line-height:1.5}.muted{color:#aebbc9;font-size:13px}.logo{display:block;width:90px;height:90px;margin:6px auto}.accent{width:68px;height:4px;background:#e22f3e;border-radius:5px;margin:15px auto 23px}.mainnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0}.mainnav button{height:118px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;background:#243344;border:1px solid #4b5b6a}.mainnav button:nth-child(2){background:#b72a35;border-color:#e35d65}button{font:inherit;cursor:pointer;border:0;color:white;border-radius:12px;background:#304357;padding:13px 12px;font-weight:700}button:active{filter:brightness(1.18)}.mainnav .ico{font-size:31px}.mainnav .txt{font-size:12px;letter-spacing:.4px}.wide{width:100%;text-align:left;margin:7px 0;min-height:54px;padding:15px 18px;display:flex;align-items:center;gap:13px;background:#e7ebf0;color:#202b38}.wide .sym{color:#bc2937;font-size:20px;width:26px}.wide .arrow{margin-left:auto;color:#b42b39}.linebtn{width:100%;min-height:57px;margin:5px 0;display:flex;align-items:center;text-align:left;gap:16px;padding-left:22px;background:#28394a;border:1px solid #42556a}.linebtn .sym{color:#7fc1d7;font-size:21px}.linebtn.loss{background:#3a2830;border-color:#75414b}.linebtn.loss .sym{color:#fa7c87}.linebtn.other{background:#35404a;margin-top:15px}.back{background:transparent;border:1px solid #566476;padding:9px 15px;margin-bottom:16px}.panel{background:#1c2936;border:1px solid #384a5a;border-radius:14px;padding:15px;margin:13px 0}.lossPanel{border-color:#77424b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid button{min-height:52px}.field{display:block;font-weight:650;margin:15px 0 6px}input,select,textarea{width:100%;border:1px solid #536678;background:#f5f7fa;color:#172331;border-radius:9px;padding:12px;font:inherit}textarea{min-height:126px;resize:vertical}.primary{background:#bd2d39;width:100%;margin-top:17px}.blue{background:#28637d}.state{display:inline-block;font-size:12px;font-weight:800;border-radius:7px;padding:4px 8px}.state.open{background:#a62836}.state.closed{background:#197a50}.entry{border-bottom:1px solid #3c4b5c;padding:13px 0}.entry:last-child{border-bottom:0}.entry p{white-space:pre-wrap;margin:9px 0}.entry button{padding:8px 12px;font-size:13px}.flex{display:flex;gap:9px;align-items:center}.flex>*{flex:1}.center{text-align:center}.photo{max-width:100%;max-height:210px;object-fit:contain;border-radius:8px}.tag{font-size:12px;color:#9cb3c5}.warn{border-left:4px solid #c73240;padding-left:12px}#app{padding-bottom:25px}small{font-size:12px}
</style></head><body><main><div id="app"></div></main><script>
const rows=[['Linea 100',Array.from({length:13},(_,i)=>98+i)],['Linea 700 dispari',Array.from({length:11},(_,i)=>705+2*i)],['Linea 700 pari',Array.from({length:10},(_,i)=>704+2*i)],['Linea 500',Array.from({length:26},(_,i)=>500+i)],['Linea 600',Array.from({length:14},(_,i)=>601+i)]];
const key='diario_es_v2';let entries=[],machines=[],prefs={},page='home',mode='intervento',line=0,bom='',itemId='',shiftDelta=-1,searchTerm='';try{let x=JSON.parse(localStorage.getItem(key)||'{}');entries=x.entries||[];machines=x.machines||[];prefs=x.prefs||{}}catch{}
const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>new Date(x).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});function persist(){localStorage.setItem(key,JSON.stringify({entries,machines,prefs}))}function go(p){page=p;draw();window.scrollTo(0,0)}function back(){go('home')}function header(title){return `<button class="back" onclick="back()">← Home</button><h2>${title}</h2>`}function logo(){return `<svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Logo attrezzi incrociati"><circle cx="50" cy="50" r="46" fill="#b82b37" stroke="#f16b72" stroke-width="3"/><g stroke="#f4f4f4" stroke-width="9" stroke-linecap="round"><path d="M27 77L71 28"/><path d="M29 27L75 76"/></g><path d="M61 20l13 1 6 13-10 9-14-12z" fill="#e9edf1"/><path d="M21 21l15 5 4 13-10 5-12-12z" fill="#e9edf1"/><path d="M71 71l9 9" stroke="#e9edf1" stroke-width="12" stroke-linecap="round"/></svg>`}function home(){return `${logo()}<h1>DIARIO<br>ELETTROSTRUMENTISTI</h1><div class="accent"></div><div class="mainnav"><button onclick="mode='intervento';go('lines')"><span class="ico">⚙</span><span class="txt">INTERVENTO</span></button><button onclick="shiftDelta=-1;go('diary')"><span class="ico">▤</span><span class="txt">DIARIO</span></button><button onclick="mode='perdita';go('lossHome')"><span class="ico">◉</span><span class="txt">PERDITE</span></button></div><button class="wide" onclick="go('search')"><span class="sym">⌕</span>RICERCA STORICO<span class="arrow">›</span></button><button class="wide" onclick="go('open')"><span class="sym">!</span>INTERVENTI APERTI (${entries.filter(x=>x.status==='aperto'&&x.kind==='intervento').length})<span class="arrow">›</span></button><button class="wide" onclick="go('backup')"><span class="sym">⇩</span>ESPORTA DATI<span class="arrow">›</span></button><p class="muted center">Prototipo locale · nessun dato condiviso tra dispositivi</p>`}
function lines(){return header(mode==='perdita'?'Segnala una perdita':'Nuovo intervento')+`<p class="muted">Seleziona la linea dell'impianto</p>${rows.map((r,i)=>`<button class="linebtn ${mode==='perdita'?'loss':''}" onclick="line=${i};go('machines')"><span class="sym">▥</span>${r[0]} <span style="margin-left:auto">›</span></button>`).join('')}<button class="linebtn other" onclick="go('other')"><span class="sym">＋</span>Altro / altri impianti<span style="margin-left:auto">›</span></button>`}
function machinesPage(){return header(rows[line][0])+`<div class="panel"><p class="muted">Seleziona il BOM</p><div class="grid">${rows[line][1].map(n=>`<button onclick="bom='${n}';go('new')">${n}</button>`).join('')}</div></div>`}
function other(){return header('Altri macchinari')+`<div class="panel"><label class="field">Aggiungi macchinario</label><input id="newmachine" placeholder="Es. Trafila 1"><button class="primary" onclick="addMachine()">Aggiungi</button></div><div class="panel">${machines.map((m,i)=>`<button class="linebtn" onclick="bom=machines[${i}];go('new')">${safe(m)} ›</button>`).join('')||'<p class="muted">Nessun macchinario aggiunto.</p>'}</div>`}
function addMachine(){let x=document.getElementById('newmachine').value.trim();if(!x)return;if(!machines.includes(x))machines.push(x);persist();draw()}
function allBoms(){return [...new Set([...rows.flatMap(r=>r[1].map(String)),...machines])]}function options(){return allBoms().map(x=>`<option value="${safe(x)}" ${String(bom)===String(x)?'selected':''}>${safe(x)}</option>`).join('')}
function newForm(){return header(mode==='perdita'?'Nuova segnalazione perdita':'Nuovo intervento')+`<div class="panel ${mode==='perdita'?'lossPanel':''}"><form id="entryform"><label class="field">Macchinario</label><select name="bom">${options()}</select><label class="field">Squadra</label><select name="team">${['A','B','C','D'].map(x=>`<option ${prefs.team===x?'selected':''}>${x}</option>`).join('')}</select>${mode==='perdita'?`<label class="field">Tipo di perdita</label><select name="fluid"><option>Vapore</option><option>Acqua</option><option>Aria</option><option>Olio</option><option>Altro</option></select><label class="field">Fotografia facoltativa</label><input type="file" id="photo" accept="image/*" capture="environment"><p class="muted">La foto viene ridimensionata e compressa. Sarà eliminata alla chiusura della perdita.</p>`:''}<label class="field">Descrizione</label><textarea name="note" required placeholder="Scrivi la segnalazione o il lavoro effettuato"></textarea><label class="field">Stato</label><select name="status"><option value="aperto">Da proseguire</option><option value="chiuso">Chiuso</option></select><button class="primary" type="submit">Salva ${mode==='perdita'?'perdita':'intervento'}</button></form></div>`}
function shrink(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let f=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/webp',.55))};img.onerror=reject;img.src=url})}
function wireNew(){document.getElementById('entryform').onsubmit=async ev=>{ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target)),photo='';let f=document.getElementById('photo')?.files[0];if(f){try{photo=await shrink(f)}catch{alert('Impossibile elaborare la foto');return}}let e={id:crypto.randomUUID(),kind:mode,bom:v.bom,team:v.team,fluid:v.fluid||'',note:v.note,status:v.status,photo,time:new Date().toISOString(),updates:[]};entries.unshift(e);prefs.team=v.team;try{persist()}catch{entries.shift();alert('Memoria locale piena. Esporta i dati e riprova senza foto.');return}go(mode==='perdita'?'lossHome':'home')}}
function card(e){return `<div class="entry"><div><strong>${safe(e.bom)}</strong> · ${e.kind==='perdita'?'PERDITA '+safe(e.fluid):'INTERVENTO'} · <span class="state ${e.status==='aperto'?'open':'closed'}">${e.status==='aperto'?'DA PROSEGUIRE':'CHIUSO'}</span></div><div class="tag">${fmt(e.time)} · Squadra ${safe(e.team)}</div><p>${safe(e.note)}</p>${e.photo?`<img class="photo" src="${e.photo}" alt="Foto della perdita">`:''}<button onclick="itemId='${e.id}';go('detail')">Dettagli / aggiorna ›</button></div>`}
function lossHome(){return header('Perdite')+`<button class="primary" onclick="mode='perdita';go('lines')">+ Nuova segnalazione</button><div class="panel lossPanel"><h2>Perdite aperte (${entries.filter(e=>e.kind==='perdita'&&e.status==='aperto').length})</h2>${entries.filter(e=>e.kind==='perdita'&&e.status==='aperto').sort((a,b)=>new Date(a.time)-new Date(b.time)).map(card).join('')||'<p class="muted">Nessuna perdita aperta.</p>'}</div><div class="panel"><h2>Perdite chiuse</h2>${entries.filter(e=>e.kind==='perdita'&&e.status==='chiuso').map(card).join('')||'<p class="muted">Nessuna perdita chiusa.</p>'}</div>`}
function openItems(){return header('Interventi aperti')+`<div class="panel">${entries.filter(e=>e.kind==='intervento'&&e.status==='aperto').sort((a,b)=>new Date(a.time)-new Date(b.time)).map(e=>`<p class="tag">Aperto da ${Math.floor((Date.now()-new Date(e.time))/86400000)} giorni</p>`+card(e)).join('')||'<p class="muted">Nessun intervento aperto.</p>'}</div>`}
function shiftBase(){let d=new Date(),h=d.getHours();if(h<6)d.setDate(d.getDate()-1);d.setHours(h>=6&&h<14?6:h>=14&&h<22?14:22,0,0,0);return d}function diary(){let start=new Date(shiftBase().getTime()+shiftDelta*28800000),end=new Date(start.getTime()+28800000);return header('Diario turni')+`<div class="panel"><div class="flex"><button onclick="shiftDelta--;draw()">←</button><div class="center" style="flex:3"><strong>${fmt(start)}</strong><br><small>fino alle ${end.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</small></div><button onclick="shiftDelta++;draw()">→</button></div><p class="muted center">Interventi e perdite registrati nel turno</p>${entries.filter(e=>new Date(e.time)>=start&&new Date(e.time)<end).map(card).join('')||'<p class="muted">Nessuna registrazione.</p>'}</div>`}
function detail(){let e=entries.find(x=>x.id===itemId);if(!e)return header('Non trovato');return header('Scheda '+safe(e.bom))+`<div class="panel">${card(e)}<h2>Aggiornamenti</h2>${e.updates.map(u=>`<div class="entry"><div class="tag">${fmt(u.time)} · Squadra ${safe(u.team)}</div><p>${safe(u.note)}</p></div>`).join('')||'<p class="muted">Nessun aggiornamento.</p>'}<form id="update"><label class="field">Squadra</label><select name="team">${['A','B','C','D'].map(x=>`<option ${prefs.team===x?'selected':''}>${x}</option>`).join('')}</select><label class="field">Aggiornamento</label><textarea name="note" placeholder="Descrivi cosa è stato fatto"></textarea><label class="field">Stato</label><select name="status"><option value="aperto" ${e.status==='aperto'?'selected':''}>Da proseguire</option><option value="chiuso" ${e.status==='chiuso'?'selected':''}>Chiuso</option></select><button class="primary">Salva aggiornamento</button></form></div>`}
function wireUpdate(){document.getElementById('update').onsubmit=ev=>{ev.preventDefault();let e=entries.find(x=>x.id===itemId),v=Object.fromEntries(new FormData(ev.target));if(!v.note.trim()&&v.status===e.status){alert('Inserisci una nota o cambia lo stato');return}e.updates.push({time:new Date().toISOString(),team:v.team,note:v.note||'Stato modificato'});e.status=v.status;prefs.team=v.team;if(e.kind==='perdita'&&e.status==='chiuso')e.photo='';persist();draw()}}
function search(){return header('Ricerca storico')+`<div class="panel"><input id="query" placeholder="Cerca BOM o parole chiave" value="${safe(searchTerm)}" oninput="searchTerm=this.value;results()"><div class="flex" style="margin-top:12px"><select id="filter" onchange="results()"><option value="all">Tutti</option><option value="intervento">Interventi</option><option value="perdita">Perdite</option></select></div><div id="matches"></div></div>`}function results(){let filter=document.getElementById('filter')?.value||'all',el=document.getElementById('matches');if(el)el.innerHTML=entries.filter(e=>(filter==='all'||e.kind===filter)&&[e.bom,e.note,e.fluid,...e.updates.map(u=>u.note)].join(' ').toLowerCase().includes(searchTerm.toLowerCase())).map(card).join('')||'<p class="muted">Nessun risultato.</p>'}
function backup(){return header('Esporta dati')+`<div class="panel"><p>I dati rimangono in questo browser. L'esportazione permette di creare una copia di sicurezza.</p><button class="primary" onclick="exportFile()">Scarica backup JSON</button><label class="field">Importa backup</label><input type="file" accept=".json,application/json" onchange="importFile(this.files[0])"><p class="muted">L'importazione sostituisce i dati locali. Le foto delle perdite chiuse non vengono conservate.</p></div>`}function exportFile(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:2,entries,machines,prefs},null,2)],{type:'application/json'}));a.href=u;a.download='diario-elettrostrumentisti-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importFile(f){if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.entries)||!Array.isArray(o.machines))throw Error();if(confirm('Sostituire i dati locali con questo backup?')){entries=o.entries;machines=o.machines;prefs=o.prefs||{};persist();go('home')}}catch{alert('Backup non valido')}}
function draw(){app.innerHTML=({home,lines,machines:machinesPage,other,new:newForm,lossHome,open:openItems,diary,detail,search,backup}[page]||home)();if(page==='new')wireNew();if(page==='detail')wireUpdate();if(page==='search')results()}draw();
</script></body></html>
